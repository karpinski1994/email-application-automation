# Configuration for Email Application Automation

# Job search configuration
search:
  urls:
    - "https://www.linkedin.com/jobs/search/?keywords=frontend%20developer%20latam"
    - "https://www.linkedin.com/jobs/search/?keywords=front-end%20developer"
    - "https://www.linkedin.com/jobs/search/?keywords=react%20developer"
  count: 10

# CV file path (relative to project root)
cv:
  path: "./my_cv.pdf"

# Gmail settings
gmail:
  draft_only: true
  token_path: "data/gmail_token.json"
  credentials_path: "credentials.json"

# LLM Configuration
llm:
  provider: "local"
  model: "qwen2.5:7b"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"

# Apify Configuration (for LinkedIn job scraping)
# Set APIFY_API_KEY in .env file (see .env.example)
apify:
  api_token: "${APIFY_API_KEY}"
  actor_id: "hKByXkMQaC5Qt9UMN"

# Privacy settings
privacy:
  redact_pii: true

# Dry run mode (for testing without API calls)
dry_run: false